  <text x="1324" y="185" fill="#FFFFFF" font-size="11" font-weight="bold" text-anchor="middle">WAOUH N°1</text>
  <text x="1268" y="216" fill="#1C1C1C" font-size="12.5">• Titre + couleur d'aura</text>
  <text x="1268" y="238" fill="#1C1C1C" font-size="12.5">• Carte d'identité de l'entreprise</text>
  <text x="1268" y="260" fill="#1C1C1C" font-size="12.5">• Ce que dit votre note</text>
