  <text x="1268" y="382" fill="#7C2D12" font-size="11.5" font-style="italic">« Voilà ce que les autres voient. »</text>
  <text x="1268" y="400" fill="#9CA3AF" font-size="11">Il n'a rien rempli — c'est ta preuve.</text>

